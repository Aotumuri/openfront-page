  <circle cx="1000" cy="315" r="235" fill="none" stroke="#13d7d1" stroke-opacity=".12"/>
  <circle cx="1000" cy="315" r="165" fill="none" stroke="#13d7d1" stroke-opacity=".08" stroke-width="54"/>
  <path d="M675 0h525v630H510z" fill="#13d7d1" opacity=".035"/>

